name: 🚀 Deploy Website to InfinityFree via FTP

on:
    push:
        branches:
            - main # Deploy when you push or merge to main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # 🏗️ Optional: Build step (only if your site requires building)
            # Uncomment this block if you need to run npm build before deploying:
            # - name: Install dependencies
            #   run: npm install
            #
            # - name: Build project
            #   run: npm run build

            - name: Upload dist folder via FTP
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  server-dir: ${{ secrets.FTP_PATH }}
                  local-dir: ./dist # 👈 this is the important line
                  exclude: |
                      **/.git*
                      **/.github*
                      **/node_modules/**
